<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Optix</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f0efeb;
        color: #14211a;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      .box { text-align: center; padding: 2rem; }
      .mark {
        width: 56px; height: 56px; border-radius: 50%;
        border: 8px solid #3a5a40; margin: 0 auto 1rem;
      }
      h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
      p { color: #5e6b60; font-size: .9rem; margin: 0; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="mark"></div>
      <h1>You're offline</h1>
      <p>Reconnect to continue using Optix.</p>
    </div>
  </body>
</html>
